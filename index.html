<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MAXEL">
<title>Control de clases</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;700;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<style>
:root{
  --bg:#000000; --surface:#141210; --surface-2:#1C1914; --ink:#F4ECD8; --muted:#A39A84; --line:#2E2A21;
  --gold:#D9AE4B; --gold-2:#F0CE7A; --gold-ink:#17120A; --ok:#7FE0A8; --warn:#FFCB6B; --bad:#FF8A80;
  --radius:16px;
  font-family:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  color:var(--ink); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);-webkit-text-size-adjust:100%}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);min-height:100vh}
h1,h2,h3{font-family:"Bricolage Grotesque",sans-serif;margin:0;letter-spacing:-.01em}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold-2);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:4px 0 16px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{width:52px;height:52px;border-radius:14px;flex:none}
.top h1{font-size:1.35rem;font-weight:800;color:var(--gold-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .row2{display:flex;gap:8px}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;background:var(--gold);color:var(--gold-ink);min-height:44px}
.btn.lime{background:linear-gradient(180deg,var(--gold-2),var(--gold));color:var(--gold-ink)}
.btn.ghost{background:transparent;color:var(--gold-2);border:1.5px solid var(--line)}
.btn.danger{background:transparent;color:var(--bad);border:1.5px solid #5A2623}
.btn.big{width:100%;padding:16px;font-size:1.1rem;border-radius:14px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1}
.actions{display:flex;gap:8px}
.actions .btn{flex:1}
.search{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);margin-bottom:12px}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:var(--radius);padding:12px 14px;border:1px solid var(--line);text-align:left;width:100%}
.item .n{font-family:"Bricolage Grotesque";font-weight:800;font-size:1.6rem;min-width:2.2ch;text-align:center;line-height:1;color:var(--gold-2)}
.item .t{flex:1;min-width:0}
.item .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .t small{color:var(--muted)}
.pill{font-size:.78rem;font-weight:700;padding:3px 9px;border-radius:99px;background:#12301F;color:var(--ok);white-space:nowrap}
.pill.vencido,.pill.agotado{background:#3A1512;color:var(--bad)}
.pill.pendiente{background:#3A2A0C;color:var(--warn)}
.empty{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:28px 20px;text-align:center;color:var(--muted)}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:#0B0A08;border:1px solid var(--line);border-bottom:0;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.sheet-head h2{font-size:1.35rem}
.x{background:var(--surface-2);border:0;border-radius:99px;width:40px;height:40px;font-size:1.2rem}
.card{background:linear-gradient(160deg,#241D0F,#0E0C08 65%);border:1px solid #4A3C1B;color:var(--ink);border-radius:22px;padding:20px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.card .name{font-family:"Bricolage Grotesque";font-weight:700;font-size:1.3rem}
.ring{position:relative;width:190px;height:190px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .num b{font-family:"Bricolage Grotesque";font-weight:800;font-size:4.4rem;line-height:1;color:var(--gold-2)}
.ring .num span{font-size:.95rem;opacity:.85}
.card .dates{font-size:.95rem;color:var(--muted)}
.block{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-top:12px}
.block h3{font-size:1rem;margin-bottom:8px}
.qrbox{display:flex;flex-direction:column;align-items:center;gap:10px}
.qrbox .q{background:#fff;padding:12px;border-radius:12px;line-height:0}
.qrbox .q img,.qrbox .q canvas{max-width:100%}
.hist{margin:0;padding:0;list-style:none;color:var(--muted);font-size:.92rem;display:flex;flex-direction:column;gap:4px}
label{display:block;font-weight:600;font-size:.92rem;margin:12px 0 4px}
input{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
input::placeholder{color:#6F6755}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{color:var(--bad);font-size:.92rem;margin-top:10px;min-height:1.2em}
.login{max-width:380px;margin:6vh auto 0;text-align:center}
.login img{width:150px;height:150px;border-radius:28px}
.login h1{font-size:2rem;font-weight:800;margin:8px 0 6px;color:var(--gold-2)}
.login p{color:var(--muted);margin:0 0 8px}
.login label{text-align:left}
.scan{position:fixed;inset:0;background:#000;z-index:30;display:flex;flex-direction:column}
.scan video{flex:1;width:100%;object-fit:cover}
.scan .frame{position:absolute;left:50%;top:42%;width:min(70vw,300px);aspect-ratio:1;transform:translate(-50%,-50%);border:4px solid var(--gold-2);border-radius:24px;box-shadow:0 0 0 100vmax rgba(0,0,0,.5)}
.scan .bar{position:absolute;left:0;right:0;bottom:0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));color:#fff;text-align:center;background:linear-gradient(transparent,rgba(0,0,0,.85))}
.scan .bar p{margin:0 0 12px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--gold-2);color:var(--gold-ink);font-weight:600;padding:12px 18px;border-radius:12px;z-index:50;max-width:90vw;text-align:center}
.ok-flash{animation:flash .5s}
@keyframes flash{0%{transform:scale(.96)}50%{transform:scale(1.03)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.ok-flash{animation:none}}
.aviso{border-radius:14px;padding:14px 16px;font-weight:700;margin-bottom:12px;font-size:1.05rem}
.aviso.ok{background:#12301F;color:var(--ok);border:1px solid #1E5A38}
.aviso.warn{background:#3A2A0C;color:var(--warn);border:1px solid #5E4410}
.center{text-align:center;color:var(--muted);padding:40px 0}
</style>
</head>
<body>
<div id="app"></div>

<script type="module">
import { firebaseConfig, ADMIN_EMAIL, NOMBRE_NEGOCIO } from "./config.js";
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, onSnapshot, collection, addDoc, updateDoc, deleteDoc, query, orderBy, increment, arrayUnion } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const fb = initializeApp(firebaseConfig);
const auth = getAuth(fb);
const db = getFirestore(fb);
const app = document.getElementById("app");
document.title = NOMBRE_NEGOCIO;

/* ---------- utilidades ---------- */
const h = (tag, attrs = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) e.setAttribute(k, v === true ? "" : v);
  }
  for (const x of kids.flat()) {
    if (x === false || x == null) continue;
    e.append(x.nodeType ? x : document.createTextNode(String(x)));
  }
  return e;
};
const hoy = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; };
const fmt = s => s ? new Date(s + "T00:00").toLocaleDateString("es", { day: "numeric", month: "short", year: "numeric" }) : "—";
const fmtHora = iso => new Date(iso).toLocaleString("es", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
const restantes = c => Math.max(0, (c.clasesTotal || 0) - (c.clasesUsadas || 0));
function estado(c) {
  const t = hoy();
  if (c.fin && t > c.fin) return { k: "vencido", txt: "Paquete vencido" };
  if (c.inicio && t < c.inicio) return { k: "pendiente", txt: "Empieza el " + fmt(c.inicio) };
  if (restantes(c) <= 0) return { k: "agotado", txt: "Sin clases disponibles" };
  return { k: "activo", txt: "Activo" };
}
const linkCliente = id => `${location.origin}${location.pathname}?c=${id}`;
let toastT;
function toast(msg) {
  document.querySelector(".toast")?.remove();
  const t = h("div", { class: "toast", role: "status" }, msg);
  document.body.append(t);
  clearTimeout(toastT);
  toastT = setTimeout(() => t.remove(), 3200);
}
function marca() {
  return h("div", { class: "brand" }, h("img", { src: "icon-512.png", alt: "" }), h("h1", {}, NOMBRE_NEGOCIO));
}

/* ---------- instalación como app (PWA) ---------- */
let instalar = null;
const esStandalone = window.matchMedia("(display-mode: standalone)").matches || navigator.standalone;
window.addEventListener("beforeinstallprompt", e => {
  e.preventDefault();
  if (esStandalone) return;
  instalar = e;
  if (document.getElementById("lista") && !document.getElementById("btn-instalar")) pintarAdmin();
});
window.addEventListener("appinstalled", () => { instalar = null; document.getElementById("btn-instalar")?.remove(); toast("App instalada"); });
async function instalarApp() {
  if (!instalar) return;
  instalar.prompt();
  await instalar.userChoice.catch(() => {});
  instalar = null;
  document.getElementById("btn-instalar")?.remove();
}
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
}

function ring(c) {
  const total = Math.max(c.clasesTotal || 0, 1), rem = restantes(c);
  const C = 2 * Math.PI * 52, off = C * (1 - rem / total);
  const wrap = h("div", { class: "ring" });
  wrap.innerHTML = `<svg viewBox="0 0 120 120" aria-hidden="true">
    <circle cx="60" cy="60" r="52" fill="none" stroke="rgba(217,174,75,.18)" stroke-width="10"/>
    <circle cx="60" cy="60" r="52" fill="none" stroke="#F0CE7A" stroke-width="10" stroke-linecap="round"
      stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"/></svg>`;
  wrap.append(h("div", { class: "num" }, h("b", {}, rem), h("span", {}, rem === 1 ? "clase restante" : "clases restantes")));
  return wrap;
}
function tarjeta(c) {
  const e = estado(c);
  return h("div", { class: "card" },
    h("div", { class: "name" }, c.nombre),
    ring(c),
    h("div", { class: "dates" }, `${c.clasesUsadas || 0} de ${c.clasesTotal || 0} usadas`),
    h("div", { class: "dates" }, `${fmt(c.inicio)} a ${fmt(c.fin)}`),
    h("span", { class: "pill " + e.k }, e.txt));
}
function qrBlock(id, nombre) {
  const url = linkCliente(id);
  const q = h("div", { class: "q" });
  new QRCode(q, { text: url, width: 240, height: 240, correctLevel: QRCode.CorrectLevel.L });
  return h("div", { class: "block qrbox" },
    h("h3", {}, "Código QR"), q,
    h("div", { class: "row" },
      h("button", { class: "btn ghost", onclick: () => {
        const cv = q.querySelector("canvas");
        if (!cv) return toast("No se pudo generar la imagen");
        const a = h("a", { href: cv.toDataURL("image/png"), download: `QR-${nombre.replace(/\s+/g, "_")}.png` });
        document.body.append(a); a.click(); a.remove();
      } }, "Descargar QR"),
      h("button", { class: "btn ghost", onclick: async () => {
        try { await navigator.clipboard.writeText(url); toast("Enlace copiado"); } catch { prompt("Copia el enlace:", url); }
      } }, "Copiar enlace"),
      h("a", { class: "btn ghost", style: "text-align:center;text-decoration:none;display:flex;align-items:center;justify-content:center", target: "_blank", rel: "noopener",
        href: "https://wa.me/?text=" + encodeURIComponent(`Hola ${nombre}, aquí puedes ver tus clases restantes: ${url}`) }, "WhatsApp")));
}

/* ---------- vista del CLIENTE (solo lectura) ---------- */
const params = new URLSearchParams(location.search);
const clienteId = params.get("c");

if (clienteId) vistaCliente(clienteId);
else vistaAdmin();

function vistaCliente(id) {
  app.append(h("div", { class: "wrap" }, h("div", { class: "center" }, "Cargando…")));
  onSnapshot(doc(db, "clientes", id), snap => {
    app.replaceChildren();
    if (!snap.exists()) {
      app.append(h("div", { class: "wrap" }, h("div", { class: "empty" }, "Este enlace no es válido. Pide a tu instructor un nuevo QR.")));
      return;
    }
    const c = snap.data();
    const hist = (c.asistencias || []).slice(-8).reverse();
    app.append(h("div", { class: "wrap" },
      h("div", { class: "top" }, marca()),
      tarjeta(c),
      hist.length ? h("div", { class: "block" }, h("h3", {}, "Tus últimas clases"),
        h("ul", { class: "hist" }, hist.map(x => h("li", {}, fmtHora(x))))) : false,
      qrBlock(id, c.nombre),
      h("p", { class: "center", style: "padding:16px 0" }, "Muestra este QR al llegar a clase.")));
  }, () => {
    app.replaceChildren(h("div", { class: "wrap" }, h("div", { class: "empty" }, "No se pudo cargar. Revisa tu conexión.")));
  });
}

/* ---------- vista del ADMINISTRADOR ---------- */
let clientes = new Map();
let unsub = null;
let detalleId = null, detalleEscaneado = false;
let filtro = "";
let abrirTras = null;

function vistaAdmin() {
  onAuthStateChanged(auth, user => {
    if (user && user.email === ADMIN_EMAIL) {
      iniciarLista();
    } else {
      if (user) signOut(auth);
      unsub?.(); unsub = null;
      mostrarLogin();
    }
  });
}

function mostrarLogin(msg = "") {
  app.replaceChildren();
  const email = h("input", { type: "email", autocomplete: "username", required: true, value: ADMIN_EMAIL });
  const pass = h("input", { type: "password", autocomplete: "current-password", required: true });
  const err = h("div", { class: "err", role: "alert" }, msg);
  const go = async () => {
    err.textContent = "";
    try { await signInWithEmailAndPassword(auth, email.value.trim(), pass.value); }
    catch { err.textContent = "Correo o contraseña incorrectos."; }
  };
  app.append(h("div", { class: "wrap login" },
    h("img", { src: "icon-512.png", alt: "" }),
    h("h1", {}, NOMBRE_NEGOCIO),
    h("p", {}, "Ingresa para administrar tus clientes."),
    h("label", {}, "Correo"), email,
    h("label", {}, "Contraseña"), pass,
    err,
    h("button", { class: "btn big", style: "margin-top:12px", onclick: go }, "Entrar")));
  pass.addEventListener("keydown", e => { if (e.key === "Enter") go(); });
}

function iniciarLista() {
  unsub?.();
  pintarAdmin();
  unsub = onSnapshot(query(collection(db, "clientes"), orderBy("nombre")), snap => {
    clientes = new Map(snap.docs.map(d => [d.id, d.data()]));
    pintarLista();
    if (abrirTras && clientes.has(abrirTras)) { const i = abrirTras; abrirTras = null; mostrarDetalle(i); }
    else if (document.querySelector(".sheet-bg") && detalleId) renderDetalle();
  }, e => {
    toast("Sin permiso o sin conexión: revisa firestore.rules y tu correo de administrador.");
    console.error(e);
  });
}

function pintarAdmin() {
  app.replaceChildren();
  const buscar = h("input", { class: "search", type: "search", placeholder: "Buscar cliente", "aria-label": "Buscar cliente",
    oninput: e => { filtro = e.target.value.toLowerCase(); pintarLista(); } });
  app.append(h("div", { class: "wrap" },
    h("div", { class: "top" }, marca(),
      h("div", { class: "row2" },
        instalar ? h("button", { class: "btn lime", id: "btn-instalar", onclick: instalarApp }, "Instalar") : false,
        h("button", { class: "btn ghost", onclick: () => signOut(auth) }, "Salir"))),
    h("div", { class: "actions", style: "margin-bottom:14px" },
      h("button", { class: "btn lime", onclick: abrirEscaner }, "Escanear QR"),
      h("button", { class: "btn", onclick: () => formulario() }, "Nuevo cliente")),
    buscar,
    h("div", { class: "list", id: "lista" })));
}

function pintarLista() {
  const lista = document.getElementById("lista");
  if (!lista) return;
  const items = [...clientes.entries()].filter(([, c]) => c.nombre.toLowerCase().includes(filtro));
  lista.replaceChildren();
  if (!items.length) {
    lista.append(h("div", { class: "empty" }, clientes.size ? "Ningún cliente coincide con la búsqueda." : "Aún no tienes clientes. Toca “Nuevo cliente” para crear el primero."));
    return;
  }
  for (const [id, c] of items) {
    const e = estado(c);
    lista.append(h("button", { class: "item", onclick: () => mostrarDetalle(id) },
      h("div", { class: "n" }, restantes(c)),
      h("div", { class: "t" }, h("b", {}, c.nombre), h("small", {}, `Vence ${fmt(c.fin)}`)),
      h("span", { class: "pill " + e.k }, e.txt)));
  }
}

/* --- hoja inferior --- */
function abrirHoja(contenido) {
  cerrarHoja();
  const bg = h("div", { class: "sheet-bg", onclick: e => { if (e.target === bg) cerrarHoja(); } },
    h("div", { class: "sheet", role: "dialog", "aria-modal": "true" }, contenido));
  document.body.append(bg);
}
function cerrarHoja() { document.querySelector(".sheet-bg")?.remove(); }
const cabecera = (t) => h("div", { class: "sheet-head" }, h("h2", {}, t, h("small", { style: "font-size:.6em;color:var(--muted);font-weight:500;margin-left:8px" }, "v7")), h("button", { class: "x", "aria-label": "Cerrar", onclick: () => { detalleId = null; detalleAviso = null; cerrarHoja(); } }, "×"));

let detalleAviso = null;
function mostrarDetalle(id, escaneado = false) {
  detalleId = id; detalleEscaneado = escaneado;
  if (!escaneado) detalleAviso = null;
  renderDetalle();
}

// Al escanear: registra la clase automáticamente (con protecciones)
async function registrarEscaneo(id) {
  const c = clientes.get(id);
  if (!c) return;
  const e = estado(c);
  if (e.k !== "activo") {
    detalleAviso = { tipo: "warn", txt: `${e.txt}. No se descontó ninguna clase.` };
    return renderDetalle();
  }
  const a = c.asistencias || [];
  const ultima = a.length ? new Date(a[a.length - 1]).getTime() : 0;
  const min = (Date.now() - ultima) / 60000;
  if (ultima && min < 5) {
    detalleAviso = { tipo: "warn", txt: `Ya se registró una clase hace ${Math.max(1, Math.round(min))} min. No se descontó otra.` };
    return renderDetalle();
  }
  detalleAviso = { tipo: "warn", txt: "Registrando clase…" };
  renderDetalle();
  try {
    const guardar = updateDoc(doc(db, "clientes", id), { clasesUsadas: increment(1), asistencias: arrayUnion(new Date().toISOString()) });
    await Promise.race([guardar, new Promise((_, rej) => setTimeout(() => rej(new Error("tiempo")), 8000))]);
    detalleAviso = { tipo: "ok", txt: `✓ Clase registrada. Quedan ${restantes(c) - 1}` };
    if (navigator.vibrate) navigator.vibrate([60, 40, 60]);
  } catch (err) {
    console.error(err);
    const sinPermiso = err && (err.code === "permission-denied");
    detalleAviso = { tipo: "warn", txt: sinPermiso ? "Sin permiso para guardar: revisa las reglas de Firestore y tu correo." : "No se pudo guardar (" + (err && (err.code || err.message) || "error") + "). Revisa tu conexión." };
  }
  renderDetalle();
}

function renderDetalle() {
  const c = clientes.get(detalleId);
  if (!c) { cerrarHoja(); return; }
  const id = detalleId, e = estado(c), rem = restantes(c);
  const puede = e.k === "activo";
  const hist = (c.asistencias || []).slice(-10).reverse();
  const nodo = h("div", {},
    cabecera(detalleEscaneado ? "Cliente escaneado" : "Cliente"),
    detalleAviso ? h("div", { class: "aviso " + detalleAviso.tipo, role: "status" }, detalleAviso.txt) : false,
    tarjeta(c),
    h("button", { class: "btn lime big", style: "margin-top:12px", disabled: !puede, onclick: () => descontar(id) },
      puede ? "Descontar 1 clase" : e.txt),
    !puede && rem > 0 && e.k === "vencido" ? h("div", { class: "err" }, "El paquete venció. Edita las fechas si lo renovó.") : false,
    h("div", { class: "actions", style: "margin-top:8px" },
      h("button", { class: "btn ghost", disabled: !(c.asistencias || []).length, onclick: () => deshacer(id) }, "Deshacer última"),
      h("button", { class: "btn ghost", onclick: () => formulario(id) }, "Editar")),
    hist.length ? h("div", { class: "block" }, h("h3", {}, "Asistencias"), h("ul", { class: "hist" }, hist.map(x => h("li", {}, fmtHora(x))))) : false,
    qrBlock(id, c.nombre),
    h("button", { class: "btn danger big", style: "margin-top:12px", onclick: () => eliminar(id) }, "Eliminar cliente"));
  abrirHoja(nodo);
}

async function descontar(id) {
  const c = clientes.get(id);
  if (!c || estado(c).k !== "activo") return;
  try {
    await updateDoc(doc(db, "clientes", id), { clasesUsadas: increment(1), asistencias: arrayUnion(new Date().toISOString()) });
    toast(`Clase descontada. Quedan ${restantes(c) - 1}`);
    document.querySelector(".card")?.classList.add("ok-flash");
  } catch (e) { toast("No se pudo guardar. Revisa tu conexión."); }
}
async function deshacer(id) {
  const c = clientes.get(id);
  const a = [...(c.asistencias || [])];
  if (!a.length) return;
  if (!confirm("¿Deshacer la última clase descontada?")) return;
  a.pop();
  try { await updateDoc(doc(db, "clientes", id), { clasesUsadas: Math.max(0, (c.clasesUsadas || 0) - 1), asistencias: a }); toast("Clase devuelta"); }
  catch { toast("No se pudo guardar."); }
}
async function eliminar(id) {
  const c = clientes.get(id);
  if (!confirm(`¿Eliminar a ${c.nombre}? Su QR dejará de funcionar.`)) return;
  try { await deleteDoc(doc(db, "clientes", id)); detalleId = null; cerrarHoja(); toast("Cliente eliminado"); }
  catch { toast("No se pudo eliminar."); }
}

/* --- formulario crear/editar --- */
function formulario(id = null) {
  const c = id ? clientes.get(id) : { nombre: "", telefono: "", clasesTotal: 8, clasesUsadas: 0, inicio: hoy(), fin: "" };
  const nombre = h("input", { value: c.nombre, required: true, autocomplete: "off" });
  const tel = h("input", { value: c.telefono || "", type: "tel", autocomplete: "off" });
  const total = h("input", { type: "number", min: "1", value: c.clasesTotal, inputmode: "numeric" });
  const usadas = h("input", { type: "number", min: "0", value: c.clasesUsadas || 0, inputmode: "numeric" });
  const ini = h("input", { type: "date", value: c.inicio || "" });
  const fin = h("input", { type: "date", value: c.fin || "" });
  const err = h("div", { class: "err", role: "alert" });
  const guardar = async () => {
    err.textContent = "";
    const n = nombre.value.trim(), t = parseInt(total.value, 10), u = parseInt(usadas.value || "0", 10);
    if (!n) return err.textContent = "Escribe el nombre del cliente.";
    if (!(t >= 1)) return err.textContent = "Las clases contratadas deben ser 1 o más.";
    if (!ini.value || !fin.value) return err.textContent = "Elige fecha de inicio y de fin.";
    if (fin.value < ini.value) return err.textContent = "La fecha final no puede ser antes del inicio.";
    if (u > t) return err.textContent = "Las clases usadas no pueden superar las contratadas.";
    const data = { nombre: n, telefono: tel.value.trim(), clasesTotal: t, clasesUsadas: u, inicio: ini.value, fin: fin.value };
    try {
      if (id) { await updateDoc(doc(db, "clientes", id), data); toast("Cambios guardados"); mostrarDetalle(id); }
      else { const ref = await addDoc(collection(db, "clientes"), { ...data, asistencias: [] }); toast("Cliente creado"); abrirTras = ref.id; cerrarHoja(); }
    } catch { err.textContent = "No se pudo guardar. Revisa tu conexión y permisos."; }
  };
  abrirHoja(h("div", {},
    cabecera(id ? "Editar cliente" : "Nuevo cliente"),
    h("label", {}, "Nombre"), nombre,
    h("label", {}, "Teléfono (opcional)"), tel,
    h("div", { class: "two" }, h("div", {}, h("label", {}, "Clases contratadas"), total), h("div", {}, h("label", {}, "Clases usadas"), usadas)),
    h("div", { class: "two" }, h("div", {}, h("label", {}, "Fecha de inicio"), ini), h("div", {}, h("label", {}, "Fecha final"), fin)),
    err,
    h("button", { class: "btn big", style: "margin-top:14px", onclick: guardar }, "Guardar cliente")));
  detalleId = null;
}

/* --- escáner (v5) --- */
let stream = null, scanning = false;
const detectorNativo = ("BarcodeDetector" in window) ? (() => { try { return new BarcodeDetector({ formats: ["qr_code"] }); } catch { return null; } })() : null;

let errorEscaner = "";
function cargarJsQR() {
  return new Promise(res => {
    if (typeof jsQR !== "undefined") return res(true);
    const sc = document.createElement("script");
    sc.src = "https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js";
    sc.onload = () => res(typeof jsQR !== "undefined");
    sc.onerror = () => res(false);
    document.head.append(sc);
  });
}
const conTiempo = (p, ms) => Promise.race([p, new Promise(res => setTimeout(() => res([]), ms))]);

async function decodificar(fuente, w, h2) {
  // fuente: <video>, <canvas> o <img>
  const cv = document.createElement("canvas"), ctx = cv.getContext("2d", { willReadFrequently: true });
  for (const max of [960, 640]) {
    const esc = Math.min(1, max / Math.max(w, h2));
    cv.width = Math.round(w * esc); cv.height = Math.round(h2 * esc);
    ctx.drawImage(fuente, 0, 0, cv.width, cv.height);
    if (typeof jsQR !== "undefined") {
      try {
        const img = ctx.getImageData(0, 0, cv.width, cv.height);
        const code = jsQR(img.data, img.width, img.height, { inversionAttempts: "attemptBoth" });
        if (code && code.data) return code.data;
      } catch (e) { errorEscaner = "jsQR: " + e.message; }
    }
    if (detectorNativo) {
      try {
        const r = await conTiempo(detectorNativo.detect(cv), 400);
        if (r.length) return r[0].rawValue;
      } catch (e) { errorEscaner = "nativo: " + e.message; }
    }
  }
  return null;
}

function procesarTexto(texto) {
  let id = null;
  try { id = new URL(texto).searchParams.get("c"); } catch {}
  if (!id) { toast("Leí un QR, pero no es de un cliente de MAXEL CLASS."); return false; }
  if (navigator.vibrate) navigator.vibrate(80);
  if (clientes.has(id)) { detalleAviso = null; mostrarDetalle(id, true); registrarEscaneo(id); }
  else toast("Este QR no corresponde a ninguno de tus clientes.");
  return true;
}

async function abrirEscaner() {
  if (!navigator.mediaDevices?.getUserMedia) return toast("Este navegador no permite usar la cámara. Usa HTTPS.");
  let raf, intentos = 0;
  const estado = h("small", { style: "display:block;opacity:.8;margin-bottom:10px" }, "Iniciando cámara…");
  const cerrar = () => {
    scanning = false; cancelAnimationFrame(raf);
    stream?.getTracks().forEach(t => t.stop()); stream = null;
    document.querySelector(".scan")?.remove();
  };
  const video = h("video", { playsinline: true, muted: true, autoplay: true });
  const foto = h("input", { type: "file", accept: "image/*", capture: "environment", style: "display:none", onchange: async e => {
    const f = e.target.files[0]; if (!f) return;
    estado.textContent = "Analizando foto…";
    const url = URL.createObjectURL(f), im = new Image();
    im.onload = async () => {
      await cargarJsQR();
      const t = await decodificar(im, im.naturalWidth, im.naturalHeight);
      URL.revokeObjectURL(url);
      if (t) { cerrar(); procesarTexto(t); }
      else { estado.textContent = "No pude leer el QR en la foto. Acércate más y que salga completo."; }
    };
    im.src = url;
  } });
  const overlay = h("div", { class: "scan" }, video, h("div", { class: "frame" }),
    h("div", { class: "bar" }, h("p", {}, "Apunta al código QR del cliente"), estado,
      h("div", { class: "actions" },
        h("button", { class: "btn lime", onclick: () => foto.click() }, "Tomar foto del QR"),
        h("button", { class: "btn", style: "background:#fff;color:#12201E", onclick: cerrar }, "Cancelar")), foto));
  document.body.append(overlay);
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
  } catch { cerrar(); return toast("Permite el acceso a la cámara para escanear."); }
  video.srcObject = stream;
  await video.play().catch(() => {});
  const okJs = await cargarJsQR();
  scanning = true;
  let ultimo = 0;
  const tick = async () => {
    if (!scanning) return;
    const ahora = performance.now();
    if (video.readyState >= 2 && video.videoWidth && ahora - ultimo > 150) {
      ultimo = ahora; intentos++;
      estado.textContent = `v5 · cámara ${video.videoWidth}x${video.videoHeight} · jsQR ${okJs ? "ok" : "NO"} · nativo ${detectorNativo ? "si" : "no"} · intentos ${intentos}${errorEscaner ? " · " + errorEscaner : ""}`;
      let texto = null;
      try { texto = await decodificar(video, video.videoWidth, video.videoHeight); } catch (e) { console.error(e); }
      if (texto && scanning) {
        if (procesarTexto(texto)) { cerrar(); return; }
        await new Promise(r => setTimeout(r, 1500));
      }
    }
    raf = requestAnimationFrame(tick);
  };
  tick();
}
</script>
